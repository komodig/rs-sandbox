[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [{ name = "None" }]
requires-python = ">=3.12,<4.0"
dynamic = ["dependencies"]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.dependencies]
Django = "~5.2"
djangorestframework = "^3.18.1"
pytz = "^2026.4"
sqlparse = "^0.6.0"
django-environ = "^0.14.0"
gunicorn = "^26.2.0"
django-model-utils = "^5.0.0"
retrying = "^1.4.2"
drf-friendly-errors = "0.14"
jsonschema = "^4.26.0"
whitenoise = "^6.12.0"
serpy = "^0.3.1"
drf-yasg = {extras = ["validation"], version = "^1.21.15"}
factory_boy = "^3.3.3"
django-storages = {extras = ["google"], version = "^1.14.6"}
django-fsm = "^3.0.1"
django-cors-headers = "^4.9.0"
freezegun = "^1.5.5"
djangorestframework-camel-case = "^1.4.2"
pyhumps = "^3.8.0"
django-simple-history = "^3.13.0"
django-rest-framework-social-oauth2 = "^1.2.0"
django-oauth-toolkit = "^3.4.1"
exponent-server-sdk = "^2.2.0"
django-better-admin-arrayfield = "^1.4.2"
phonenumbers = "^9.0.40"
django-filter = "^26.1"
redis = "^8.1.0"
huey = "^3.4.0"
django-huey-logger = "^1.0.0"
python-dotenv = "^1.2.3"
psycopg2-binary = "^2.9.13"
anyio = "^4.15.1"
djangorestframework-stubs = "^3.18.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-xdist = "^3.8.0"
pytest-django = "^4.14.0"
pytest-cov = "^7.1.0"
pre-commit = "^4.6.2"
django-extensions = "^4.1"
ipython = "^9.17.1"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
